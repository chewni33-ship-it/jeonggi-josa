<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>정기안전점검 현장조사</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="현장조사">
<style>
:root{
  --ground:#F5F7FA; --surface:#FFFFFF; --ink:#1B2430; --ink-2:#4A5766; --muted:#7C8896; --line:#DDE3EA;
  --accent:#1F5FA8; --accent-soft:#E8F0F9;
  --ok:#0F7A5A; --ok-soft:#E4F2EC; --warn:#B26A00; --warn-soft:#FBEFD9; --no:#B23535; --no-soft:#F9E6E6;
  --idle:#6B7784; --idle-soft:#EDF0F3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.5 "Malgun Gothic","Apple SD Gothic Neo",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:860px;margin:0 auto;padding:12px 16px 120px}
button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer}
button.주{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.작게{padding:6px 12px;min-height:36px;font-size:14px}
button:disabled{opacity:.45}
input,select,textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
label.칸{display:block;margin:10px 0}
label.칸>span{display:block;font-size:14px;color:var(--ink-2);margin-bottom:4px}
.카드{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.힌트{font-size:13px;color:var(--muted)}
.줄{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.한줄{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.고르기{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.고르기 button{text-align:left}
.고르기 button.켬{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.현장{display:flex;gap:10px;align-items:center}
.현장 .글{flex:1;min-width:0}
.현장 b{display:block}
/* 점검 화면 */
#진행{height:6px;background:var(--idle-soft);border-radius:3px;overflow:hidden;margin:8px 0 4px}
#진행 i{display:block;height:100%;background:var(--accent);width:0}
.거르개{position:sticky;top:57px;z-index:4;background:var(--ground);padding:8px 0;display:flex;gap:6px;overflow-x:auto}
.거르개 button{white-space:nowrap}
.거르개 button.켬{background:var(--ink);border-color:var(--ink);color:#fff}
h2.묶음{font-size:15px;color:var(--accent);margin:22px 0 4px;padding-bottom:4px;border-bottom:2px solid var(--accent)}
h3.대{font-size:14px;color:var(--ink-2);margin:14px 0 2px}
.항목{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}
.항목[data-판정="적합"]{border-left-color:var(--ok)}
.항목[data-판정="보완"]{border-left-color:var(--warn)}
.항목[data-판정="부적합"]{border-left-color:var(--no)}
.항목[data-판정="해당없음"]{border-left-color:var(--idle);opacity:.8}
.항목 .제목{font-weight:600}
.항목 .제목 small{color:var(--muted);font-weight:400;margin-right:6px}
.항목 .기준{font-size:13px;color:var(--ink-2);margin-top:2px}
.판정{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.판정 button{padding:8px 4px;font-size:15px}
.판정 button.켬[data-v="적합"]{background:var(--ok);border-color:var(--ok);color:#fff}
.판정 button.켬[data-v="보완"]{background:var(--warn);border-color:var(--warn);color:#fff}
.판정 button.켬[data-v="부적합"]{background:var(--no);border-color:var(--no);color:#fff}
.판정 button.켬[data-v="해당없음"]{background:var(--idle);border-color:var(--idle);color:#fff}
.조건줄{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0}
.조건줄 .판정{grid-template-columns:1fr 1fr;margin:0;min-width:150px}
.조건줄 button.켬{background:var(--accent);border-color:var(--accent);color:#fff}
.문구{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.문구 button{text-align:left;white-space:normal}
details.더보기{margin:12px 0}
.연동띠{padding:10px 14px;cursor:pointer;margin-bottom:8px}
details.현장묶음 summary{cursor:pointer}
.관리줄{cursor:pointer;padding:10px 14px}
.관리줄.뺌{opacity:.5}
.기본표{color:var(--accent)}
.점검줄{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);margin-top:8px}
.연동띠[data-상태="좋음"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.연동띠[data-상태="나쁨"]{background:var(--no-soft);border-color:var(--no);color:var(--no)}
details.더보기 summary{font-weight:700;padding:12px;border:1px dashed var(--line,#ccc);border-radius:10px;cursor:pointer}
.더{margin-top:10px;display:grid;gap:8px}
.측정{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.측정 label span{font-size:13px;color:var(--ink-2)}
.지적{background:var(--warn-soft);border-radius:8px;padding:10px}
.항목[data-판정="부적합"] .지적{background:var(--no-soft)}
.지적 b{font-size:14px}
.사진들{display:flex;gap:12px;align-items:flex-start}
.찍은것{flex:1;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.사진들 .틀{position:relative;width:132px}
.사진들 .틀 img{width:132px;height:99px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
.사진들 .빼기{position:absolute;top:-8px;right:-8px;width:26px;height:26px;min-height:0;padding:0;border-radius:13px;background:#fff;font-size:14px;line-height:1}
.사진글{margin-top:4px;padding:5px 6px;font-size:13px}
.찍기들{display:flex;flex-direction:column;gap:6px}
.사진들 label.찍기{display:inline-flex;align-items:center;justify-content:center;width:132px;height:58px;border:1.5px dashed var(--accent);border-radius:6px;color:var(--accent);font-size:16px;font-weight:600;cursor:pointer;background:var(--accent-soft)}
.사진들 label.찍기.앨범{height:36px;font-size:14px;font-weight:400;background:#fff}
.사진들 label.찍기.필요{border-color:var(--no);color:var(--no);background:var(--no-soft)}
.사진들 input[type=file]{display:none}
.검토값{color:var(--accent);font-weight:600}
.판정제안{font-size:14px;color:var(--ok)}
.항목 .근거{font-size:12px;color:var(--muted)}
.판정제안.밖{color:var(--no);font-weight:600}
.제원 summary{cursor:pointer}
.제원 table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.제원 th{text-align:left;color:var(--ink-2);font-weight:400;width:32%;padding:4px 8px 4px 0;vertical-align:top}
.제원 td{padding:4px 0;border-bottom:1px solid var(--line)}
.지난사진{display:flex;gap:6px;align-items:flex-end;margin-top:6px}
.지난사진 img{width:96px;height:72px;object-fit:cover;border-radius:6px;border:2px solid var(--warn)}
.예시{width:150px;flex:none;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff}
.예시 img{width:100%;height:105px;object-fit:cover;border-radius:5px;display:block}
.예시 span{display:block;font-size:12px;color:var(--ink-2);line-height:1.35;margin-top:3px}
.덮개{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;color:#fff;text-align:center}
.덮개 img{max-width:100%;max-height:78vh;border-radius:6px}
@media (max-width:560px){.사진들{flex-direction:column-reverse}.예시{width:100%}.예시 img{height:160px}}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;z-index:5}
.알림{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.알림.보임{opacity:.95}
.남은일 li{margin:4px 0}
h2.전용머리{font-size:15px;color:var(--accent);margin:26px 0 4px;padding-bottom:4px;border-bottom:2px solid var(--accent)}
.전용줄{border-top:1px dashed var(--line);padding:10px 0 4px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.전용줄 .고정{font-weight:600;grid-column:1/-1}
.전용줄 .고정 .기준{font-weight:400}
.전용줄 .판정{grid-column:1/-1;margin-top:0}
.전용줄 label span{font-size:13px;color:var(--ink-2)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1 id="머리">정기안전점검 현장조사</h1><button class="작게" id="처음으로" hidden>목록</button></header>
<main id="화면"></main>
<footer id="바닥" hidden></footer>
<div class="알림" id="알림"></div>

<script>// 꾸러미(zip) 만들기·읽기 — 바깥 라이브러리 없이.
// 만들 때는 압축하지 않고(저장 방식) 담는다. 사진은 이미 jpg 라 압축해도 거의 안 줄어든다.
// 읽을 때는 저장·deflate 둘 다 읽는다 (한글 hwpx 양식은 deflate).
const 집 = (() => {
  const 표 = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    표[n] = c >>> 0;
  }
  const crc32 = (u8) => {
    let c = 0xffffffff;
    for (let i = 0; i < u8.length; i++) c = 표[(c ^ u8[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  };
  const 글 = new TextEncoder();

  // 파일들: [{이름, 데이터: Uint8Array | string}] → Blob
  function 만들기(파일들) {
    const 조각 = [], 목록 = [];
    let 위치 = 0;
    for (const f of 파일들) {
      const 이름 = 글.encode(f.이름);
      const 데이터 = typeof f.데이터 === "string" ? 글.encode(f.데이터) : f.데이터;
      const crc = crc32(데이터);
      const 머리 = new DataView(new ArrayBuffer(30));
      머리.setUint32(0, 0x04034b50, true);
      머리.setUint16(4, 20, true);
      머리.setUint16(6, 0x0800, true); // 이름이 UTF-8
      머리.setUint32(14, crc, true);
      머리.setUint32(18, 데이터.length, true);
      머리.setUint32(22, 데이터.length, true);
      머리.setUint16(26, 이름.length, true);
      조각.push(머리, 이름, 데이터);
      목록.push({ 이름, crc, 크기: 데이터.length, 위치 });
      위치 += 30 + 이름.length + 데이터.length;
    }
    let 목록크기 = 0;
    for (const m of 목록) {
      const d = new DataView(new ArrayBuffer(46));
      d.setUint32(0, 0x02014b50, true);
      d.setUint16(4, 20, true);
      d.setUint16(6, 20, true);
      d.setUint16(8, 0x0800, true);
      d.setUint32(16, m.crc, true);
      d.setUint32(20, m.크기, true);
      d.setUint32(24, m.크기, true);
      d.setUint16(28, m.이름.length, true);
      d.setUint32(42, m.위치, true);
      조각.push(d, m.이름);
      목록크기 += 46 + m.이름.length;
    }
    const 끝 = new DataView(new ArrayBuffer(22));
    끝.setUint32(0, 0x06054b50, true);
    끝.setUint16(8, 목록.length, true);
    끝.setUint16(10, 목록.length, true);
    끝.setUint32(12, 목록크기, true);
    끝.setUint32(16, 위치, true);
    조각.push(끝);
    return new Blob(조각, { type: "application/zip" });
  }

  async function 풀기(u8) {
    const 흐름 = new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Uint8Array(await new Response(흐름).arrayBuffer());
  }

  // Blob/ArrayBuffer → Map(이름 → Uint8Array)
  async function 읽기(원본) {
    const buf = 원본 instanceof Blob ? await 원본.arrayBuffer() : 원본;
    const u8 = new Uint8Array(buf), d = new DataView(buf);
    let e = u8.length - 22;
    while (e >= 0 && d.getUint32(e, true) !== 0x06054b50) e--;
    if (e < 0) throw new Error("zip 파일이 아니에요");
    const 개수 = d.getUint16(e + 10, true);
    let p = d.getUint32(e + 16, true);
    const 결과 = new Map(), 풀이 = new TextDecoder();
    for (let i = 0; i < 개수; i++) {
      const 방식 = d.getUint16(p + 10, true);
      const 압축크기 = d.getUint32(p + 20, true);
      const 이름길이 = d.getUint16(p + 28, true), 덧길이 = d.getUint16(p + 30, true), 말길이 = d.getUint16(p + 32, true);
      const 머리위치 = d.getUint32(p + 42, true);
      const 이름 = 풀이.decode(u8.subarray(p + 46, p + 46 + 이름길이));
      const 시작 = 머리위치 + 30 + d.getUint16(머리위치 + 26, true) + d.getUint16(머리위치 + 28, true);
      const 날것 = u8.subarray(시작, 시작 + 압축크기);
      if (!이름.endsWith("/")) 결과.set(이름, 방식 === 8 ? await 풀기(날것) : 날것.slice());
      p += 46 + 이름길이 + 덧길이 + 말길이;
    }
    return 결과;
  }

  return { 만들기, 읽기, crc32 };
})();

// ───────── 저장 (태블릿 안 IndexedDB) ─────────
const 저장소 = (() => {
  let db;
  const 열기 = () => db || (db = new Promise((ok, no) => {
    const r = indexedDB.open("정기안전점검", 1);
    r.onupgradeneeded = () => { r.result.createObjectStore("점검", {keyPath: "id"}); r.result.createObjectStore("사진"); };
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  }));
  const 일 = async (곳, 방식, fn) => { const d = await 열기(); return new Promise((ok, no) => {
    const t = d.transaction(곳, 방식); const r = fn(t.objectStore(곳)); t.oncomplete = () => ok(r && r.result); t.onerror = () => no(t.error); }); };
  return {
    목록: () => 일("점검", "readonly", s => s.getAll()),
    읽기: id => 일("점검", "readonly", s => s.get(id)),
    쓰기: 점 => 일("점검", "readwrite", s => s.put(점)),
    지우기: async id => { await 일("점검", "readwrite", s => s.delete(id));
      await 일("사진", "readwrite", s => s.delete(IDBKeyRange.bound(id + "/", id + "/￿"))); },
    사진쓰기: (키, blob) => 일("사진", "readwrite", s => s.put(blob, 키)),
    사진읽기: 키 => 일("사진", "readonly", s => s.get(키)),
    사진지우기: 키 => 일("사진", "readwrite", s => s.delete(키)),
  };
})();

async function 목록화면() {
  $("#머리").textContent = "정기안전점검 현장조사";
  $("#처음으로").hidden = true; 바닥.hidden = true;
  const 점검들 = (await 저장소.목록()).sort((a, b) => (b.고친때 || "").localeCompare(a.고친때 || ""));
  const 진행글 = p => { const 항목 = 점검항목(p).filter(x => !p.결과[x.번호]?.자동); return `${항목.filter(x => p.결과[x.번호]?.판정).length}/${항목.length}`; };
  const 이은 = new Set();
  const 불러온 = 불러온현장(), 펼친 = 읽어("펼친현장", []);
  const 현장칸 = PC현장().filter(현 => 불러온.includes(현.id)).map(현 => `<details class="카드 현장묶음" data-현장="${글(현.id)}" ${펼친.includes(현.id) ? "open" : ""}>
      <summary><b>${글(현.공사개요?.공사명 || "이름 없는 현장")}</b>
        <span class="힌트">${글(현.공사개요?.위치 || "")} · 점검 ${현.점검.length}개</span></summary>
      ${현.점검.map(q => {

    <p class="힌트">조사 내용은 이 태블릿 안에 저절로 저장돼요. 인터넷이 없어도 됩니다. <a href="#" id="새판받기" style="float:right" class="힌트">화면 판 11.03 10:39 · 새 판 받기</a></p>

    ${그밖.map(p => `<div class="카드 현장"><div class="글"><b>${글(p.공사명)}</b>
        <span class="힌트">${글(체크리스트[p.공종파일].공종)} ${p.차수}차 · ${글(p.조사일)} · ${진행글(p)}</span></div>
        <button data-열기="${p.id}" class="주 작게">열기</button><button data-지우기="${p.id}" class="작게">지우기</button></div>`).join("")}
    <button class="작게" id="점검표관리" style="width:100%;margin-top:18px">⚙ 점검표 관리 (관리자) — 항목 빼기·더하기·문구 고치기</button>
    <details class="카드" id="연동설정" style="margin-top:18px" ${연동.열쇠() ? "" : "open"}><summary><b>PC 자동 연동 설정</b> <span class="힌트">열쇠 ${연동.열쇠() ? "넣어 둠" : "없음"}</span></summary>
      <p class="힌트">열쇠를 한 번 넣으면 조사 내용이 인터넷 될 때마다 사무실 PC로 저절로 가고, PC가 보낸 준비 자료도 받아요.</p>
      <label class="칸"><span>연동 열쇠 ${연동.열쇠() ? "(넣어 둠)" : ""}</span><input id="열쇠" type="password" autocomplete="off" placeholder="github_pat_ 로 시작하는 글자"></label>
      <button class="주 작게" id="열쇠저장">저장하고 시험</button> <button class="작게" id="열쇠빼기">열쇠 지우기</button>
      <span id="열쇠결과" class="힌트"></span></details>`;
  $("#열쇠저장").onclick = async () => {

    $("#열쇠결과").textContent = "시험 중…";
    try { await 연동.준비목록(); $("#열쇠결과").textContent = "✓ 연결됐어요"; $("#열쇠").value = ""; 연동하기(); }

  $("#새판받기").onclick = async e => {      // 저장해 둔 화면 파일만 지우고 다시 받는다 (조사 내용·사진·열쇠는 그대로)
    e.preventDefault();

      for (const r of await navigator.serviceWorker?.getRegistrations?.() || []) await r.unregister();
      for (const k of await caches.keys()) await caches.delete(k);

    location.replace(location.pathname + "?v=" + Date.now());

    if (!confirm("이 현장을 목록에서 뺄까요?\n(이미 시작한 점검은 「그 밖의 점검」에 남아요. 다시 불러올 수 있어요)")) return;

  });

  화면.querySelectorAll("[data-지우기]").forEach(b => b.onclick = async () => {

    if (!confirm(`「${p.공사명}」 점검을 지울까요?\n사진도 함께 지워지고 되돌릴 수 없어요.\n(PC로 보냈는지 먼저 확인하세요)`)) return;
    await 저장소.지우기(p.id); 목록화면();
  });
}

async function 현장불러오기화면() {
  $("#머리").textContent = "현장 불러오기";
  $("#처음으로").hidden = false; 바닥.hidden = true;
  if (!연동.열쇠()) { 화면.innerHTML = `<div class="카드">먼저 첫 화면 아래 「PC 자동 연동 설정」에 열쇠를 넣어 주세요.</div>`; return; }
  화면.innerHTML = `<div class="카드 힌트">PC 현장 목록을 받는 중…</div>`;
  let 목록;
  try {
    const 글자 = await 연동.부르기("GET", "현장목록.json", null, true);
    목록 = 글자 ? JSON.parse(글자) : [];
    if (글자) localStorage.setItem("현장목록", 글자);
  } catch (e) {
    화면.innerHTML = `<div class="카드">PC 현장 목록을 받지 못했어요 — ${글(e.message)}<br><span class="힌트">인터넷이 되는 곳에서 다시 해 주세요.</span></div>`; return;
  }
  const 불러온 = 불러온현장();
  화면.innerHTML = `<p class="힌트">불러오면 그 현장의 점검 정보(공종·차수·제원·지난 지적)를 이 아이패드에 한꺼번에 받아 둬요. 현장에 인터넷이 없어도 돼요.</p>
    ${목록.length ? 목록.map(현 => `<div class="카드 현장"><div class="글"><b>${글(현.공사개요?.공사명 || "이름 없는 현장")}</b>
      <span class="힌트">${글(현.공사개요?.위치 || "")} · 점검 ${현.점검.length}개</span></div>
      <button class="${불러온.includes(현.id) ? "" : "주 "}작게" data-불러오기="${글(현.id)}">${불러온.includes(현.id) ? "다시 받기" : "불러오기"}</button></div>`).join("")
      : `<div class="카드 힌트">PC에 현장이 없어요. PC 프로그램에서 안전관리계획서로 현장을 먼저 만드세요.</div>`}`;
  화면.querySelectorAll("[data-불러오기]").forEach(b => b.onclick = async () => {
    const 현 = 목록.find(x => x.id === b.dataset.불러오기);
    b.disabled = true;
    try {
      const sha = Object.fromEntries((await 연동.준비목록()).map(f => [f.name, f.sha]));
      const 받은 = 읽어("준비sha", {});
      let n = 0;
      for (const q of 현.점검) {
        const 이름 = q.키 + ".json";
        if (!sha[이름]) continue;               // 보고서까지 끝난 점검은 준비 자료가 없다
        b.textContent = `받는 중 ${++n}…`;
        await 저장소.사진쓰기("준비/" + 이름, await 연동.부르기("GET", "준비/" + 이름, null, true));
        받은[이름] = sha[이름];
      }
      localStorage.setItem("준비sha", JSON.stringify(받은));
      localStorage.setItem("불러온현장", JSON.stringify([...new Set([...불러온현장(), 현.id])]));
      localStorage.setItem("펼친현장", JSON.stringify([...new Set([...읽어("펼친현장", []), 현.id])]));
      알림(`「${현.공사개요?.공사명 || "현장"}」 점검 ${n}개를 받았어요`);
      목록화면();
    } catch (e) { alert("현장을 받지 못했어요: " + e.message); b.disabled = false; b.textContent = "불러오기"; }
  });
}

// ───────── 점검 화면 ─────────
// 체크리스트 3판: 「핵심」 항목만 기본으로 보이고 나머지는 「더 보기」 (판정하면 기본 목록에 들어간다).
// 핵심 칸이 없는 옛 체크리스트는 2판처럼 세부종류에 맞는 항목을 모두 보인다. 보고서한글.점검항목 과 같은 규칙.
function 해당없음이유(점, x) {
  if (x.세부종류 && x.세부종류 !== "공통" && !점.세부종류.includes(x.세부종류)) return `현장에 ${x.세부종류} 없음`;
  if (x.조건 === "_2차이상" && 점.차수 === 1) return "1차 점검 (지난 지적 없음)";
  if (x.조건 && (점.조건 || {})[x.조건] === false) return "현장 조건에 해당 없음";
  return "";
}
function 모든항목(점) {
  const 목 = 체크리스트[점.공종파일];
  const 펴기 = (목록, 앞) => {
    const 새판 = 목록.항목.some(y => y.핵심);
    return 목록.항목.filter(x => x.변경 !== "삭제").map(x => ({...x, 번호: 앞 + x.번호,
      기본: 새판 ? !!x.핵심 : (x.세부종류 === "공통" || 점.세부종류.includes(x.세부종류))}));
  };
  const 서류 = x => x.번호.startsWith("공") || x.핵심 === "서류" || (!x.핵심 && x.구분 === "서류");
  return [...펴기(체크리스트.공통, "공"), ...펴기(목, "")]
    .map(x => ({...x, 묶음: 서류(x) ? "서류·일반 안전" : `${목.공종} 현장 점검`}))
    .sort((a, b) => 서류(b) - 서류(a));
}
// 세부종류·현장 조건에 안 맞는 항목은 해당없음 (판정 안 한 것만 — 점검자가 고른 판정은 건드리지 않는다)
function 자동해당없음(점) {
  let n = 0;
  for (const x of 점검항목(점)) {
    const 왜 = 해당없음이유(점, x);
    if (왜 && !점.결과[x.번호]?.판정) { 점.결과[x.번호] = {...(점.결과[x.번호] || {}), 판정: "해당없음", 자동: 왜}; n++; }
  }
  return n;
}
function 점검항목(점) { return 모든항목(점).filter(x => x.기본 || 점.결과[x.번호]?.판정); }
function 더보기항목(점) { return 모든항목(점).filter(x => !x.기본 && !점.결과[x.번호]?.판정 && !해당없음이유(점, x)); }

function 지적목록(점) {
  let n = 0;
  return 점검항목(점).filter(x => ["보완", "부적합"].includes(점.결과[x.번호]?.판정)).map(x => {
    const r = 점.결과[x.번호];
    return {번호: ++n, 항목: x.번호, 항목명: x.점검항목, 판정: r.판정, 위치: r.위치 || "", 문제: r.문제 || "", 대책: r.대책 || "", 기한: r.기한 || ""};
  });
}

let 지금, 거름 = "전체", 저장시계;

// 구조검토 제원 → 그 값을 보며 확인할 항목 (항목 글에 이 말이 있으면 항목 아래에 보여 준다)
const 제원말 = {"벽이음": ["벽이음", "벽 연결"], "부재 간격": ["비계기둥", "띠장 간격", "띠장 방향", "장선 방향"],

  "동바리 종류": ["파이프서포트 설치간격", "시스템동바리 설치"], "지보 형식": ["버팀대", "어스앵커"]};
function 제원힌트(x) {
  if (x.번호.startsWith("공")) return [];
  return (지금.제원 || []).filter(([k]) => (제원말[k] || []).some(말 => x.점검항목.includes(말)));

// 체크리스트 2판의 기준값(하한·상한) — 잰 값이 벗어나면 판정을 제안만 한다 (판정은 점검자)
const 수 = v => String(+v);
function 기준값글(x, r) {
  const v = x.기준값 || {}, 단 = v.단위 || x.단위 || "";
  if (v.현장값 || (v.하한 == null && v.상한 == null)) return r?.설계 ? `${r.설계} ${단} (설계)` : (x.기준 || "-");
  if (v.하한 != null && v.상한 != null) return `${수(v.하한)}~${수(v.상한)} ${단}`;
  return v.하한 != null ? `${수(v.하한)} ${단} 이상` : `${수(v.상한)} ${단} 이하`;
}
function 측정판정(x, r) {
  const v = x.기준값 || {}, 값 = parseFloat(String(r.측정 || "").replace(",", ""));
  if (isNaN(값)) return null;
  let 하 = v.하한, 상 = v.상한;
  if (v.현장값) {                    // 구조검토서 값을 「설계」 칸에 적었으면 그 값과 비교 (이상/이하 방향을 모르면 제안 안 함)
    return null;
  }
  if (하 != null && 값 < +하) return "미달";
  if (상 != null && 값 > +상) return "초과";
  return (하 != null || 상 != null) ? "이내" : null;
}

function 항목칸(x) {
  const r = 지금.결과[x.번호] || {};
  return `<div class="항목" data-번호="${x.번호}" data-판정="${r.판정 || ""}">
    <div class="제목"><small>${x.번호}</small>${글(x.점검항목)}${x.세부종류 !== "공통" ? ` <small>(${글(x.세부종류)})</small>` : ""}</div>
    ${x.기준 ? `<div class="기준">기준: ${글(x.기준)}</div>` : ""}

    ${제원힌트(x).map(([k, v]) => `<div class="기준 검토값">📐 구조검토 ${글(k)}: ${글(v)}</div>`).join("")}
    <div class="판정">${판정들.map(v => `<button data-v="${v}" class="${r.판정 === v ? "켬" : ""}">${v}</button>`).join("")}</div>
    ${r.자동 ? `<div class="힌트" data-자동>자동 해당없음 — ${글(r.자동)} (현장이 다르면 다른 판정을 누르세요)</div>` : ""}
    <div class="더" data-더></div></div>`;
}

function 항목달기(el, x) {
  const 그리기 = () => {
    const r = 지금.결과[x.번호] || {};
    const 더 = $("[data-더]", el);
    if (!r.판정 || r.판정 === "해당없음") { 더.innerHTML = ""; return; }
    더.innerHTML = `

// 긴 변 1600px, jpg 85% — 보고서에 충분하고 꾸러미가 가볍다
async function 줄이기(f) {

  try { bmp = await createImageBitmap(f, {imageOrientation: "from-image"}); }
  catch {   // 아이패드 사파리 등 — 그림 요소로 읽는다 (사파리는 사진 방향을 알아서 맞춘다)

  c.width = Math.round(bmp.width * 배); c.height = Math.round(bmp.height * 배);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);

// ───────── 자동 연동 (깃허브 비공개 저장소 — PC 프로그램 연동.py 와 짝) ─────────
// 준비/*.json = PC가 올린 준비 자료, 조사/<점검id>/조사.json·사진/ = 이 태블릿이 올리는 조사 결과.

const 연동 = {

  async 부르기(방법, 경로, 몸, 날것 = false) {
    const r = await fetch(`https://api.github.com/repos/${this.저장소}/contents/${경로.split("/").map(encodeURIComponent).join("/")}`, {
      method: 방법, cache: "no-store", body: 몸 ? JSON.stringify(몸) : undefined,
      headers: {Authorization: "Bearer " + this.열쇠(), Accept: 날것 ? "application/vnd.github.raw+json" : "application/vnd.github+json"}});
    if (r.status === 404 && 방법 === "GET") return null;
    if (r.status === 401) throw new Error("열쇠가 맞지 않아요");
    if (!r.ok) { const e = new Error(`깃허브 응답 ${r.status}`); e.코드 = r.status; throw e; }
    return 날것 ? r.text() : r.json();
  },
  async 쓰기(경로, b64, 말, 덮어쓰기) {
    const 있음 = 덮어쓰기 ? await this.부르기("GET", 경로) : null;
    try { await this.부르기("PUT", 경로, {message: 말, content: b64, ...(있음 ? {sha: 있음.sha} : {})}); }
    catch (e) { if (덮어쓰기 || e.코드 !== 422) throw e; }      // 사진이 이미 올라가 있음
  },
  async 준비목록() { return ((await this.부르기("GET", "준비")) || []).filter(f => f.name.endsWith(".json")); },
};
const 읽어 = (키, 없으면) => { try { return JSON.parse(localStorage.getItem(키)) ?? 없으면; } catch { return 없으면; } };
const PC현장 = () => 읽어("현장목록", []);
const 불러온현장 = () => 읽어("불러온현장", []);
async function 준비읽기(키) { const t = await 저장소.사진읽기("준비/" + 키 + ".json"); return t ? JSON.parse(t) : null; }
async function PC자료받기(받을) {      // 받을 = 준비/ 목록 [{name, sha}] — 바뀐 것만 받아 이 태블릿에 둔다

  if (목록글 && 목록글 !== localStorage.getItem("현장목록")) { localStorage.setItem("현장목록", 목록글); 바뀜 = true; }
  const 받은 = 읽어("준비sha", {});

}
// ───────── 점검표 관리 (관리자) — 원본은 비공개 저장소 체크리스트/*.json. PC는 1분 안에 받아 보고서에 쓴다 ─────────

    <div class="한줄">
      <label class="칸"><span>구분</span><select id="편_구분"><option value="현장" ${x.구분 !== "서류" ? "selected" : ""}>현장 (위치 칸 있음)</option>
        <option value="서류" ${x.구분 === "서류" ? "selected" : ""}>서류 (위치 칸 없음)</option></select></label>
      <label class="칸"><span>점검 화면에</span><select id="편_핵심"><option value="" ${x.핵심 ? "" : "selected"}>「더 보기」 안에</option>
        ${공통 ? `<option value="서류" ${x.핵심 ? "selected" : ""}>기본으로 보이기 (서류·일반)</option>`
          : `<option value="서류" ${고름("서류", x.핵심)}>기본으로 보이기 — 서류·일반 묶음</option><option value="현장" ${고름("현장", x.핵심)}>기본으로 보이기 — 현장 점검 묶음</option>`}</select></label>
    </div>
    ${조건들.length ? `<label class="칸"><span>현장 조건 (답이 「아니오」면 저절로 해당없음)</span><select id="편_조건"><option value="">없음</option>
      ${조건들.map(c => `<option value="${글(c.키)}" ${고름(c.키, x.조건)}>${글(c.질문)}</option>`).join("")}</select></label>` : ""}
    <label class="칸"><span>기준</span><textarea id="편_기준" placeholder="예) 수직·수평 5m 이내">${글(x.기준)}</textarea></label>
    <label class="칸"><span>근거 (법령·지침 조항)</span><input id="편_출처" value="${글(x.출처)}" placeholder="예) 산안규칙 제59조"></label>
    <p style="margin:14px 0 4px"><b>대표 문구</b> <span class="힌트">보완·부적합 때 고르는 문장 — 비워 둔 줄은 안 나와요</span></p>
    ${문.map((m, i) => `<div class="한줄"><label class="칸"><span>문제점 ${i + 1}</span><input data-문제="${i}" value="${글(m.문제)}"></label>
      <label class="칸"><span>대책 ${i + 1}</span><input data-대책="${i}" value="${글(m.대책)}"></label></div>`).join("")}
    <p id="편_알림" class="힌트"></p></div>`;
  바닥.hidden = false;
  바닥.innerHTML = `<button id="편_목록">목록으로</button>${새로 ? "" : `<button id="편_뺌">${x.변경 === "삭제" ? "되살리기" : "이 항목 빼기"}</button>`}<button class="주" id="편_저장">저장</button>`;
  $("#편_목록").onclick = 관리목록;
  const 올리기끝 = async (말, 뒤) => {
    const 단추 = 바닥.querySelectorAll("button"); 단추.forEach(b => b.disabled = true); $("#편_알림").textContent = "저장하는 중…";
    try { await 점검표올리기(말); 알림("저장했어요"); 뒤(); }
    catch (e) { $("#편_알림").textContent = "저장하지 못했어요 — " + e.message; 단추.forEach(b => b.disabled = false); }
  };
  if (!새로) $("#편_뺌").onclick = () => {
    const 되살림 = x.변경 === "삭제";
    if (!되살림 && !confirm(`「${x.점검항목}」 항목을 뺄까요?\n(기록으로 남고, 「뺀 항목도 보기」에서 되살릴 수 있어요)`)) return;
    if (되살림) { x.변경 = "수정"; x.변경이유 = "관리자 화면에서 되살림"; } else { x.변경 = "삭제"; x.핵심 = ""; x.변경이유 = "관리자 화면에서 뺌"; }
    올리기끝(`항목 ${x.번호} ${되살림 ? "되살림" : "뺌"}`, 관리목록);
  };
  $("#편_저장").onclick = () => {
    const 이름 = $("#편_항목").value.trim();
    if (!이름) { $("#편_알림").textContent = "점검 항목을 써 주세요"; return; }
    const 핵심 = $("#편_핵심").value, 출처 = $("#편_출처").value.trim();
    if (핵심 && !출처 && !confirm("근거(법령·지침 조항)가 비어 있어요.\n그래도 기본으로 보이게 저장할까요?")) return;
    Object.assign(x, {점검항목: 이름, 대구분: $("#편_대")?.value || x.대구분, 세부종류: 공통 ? "공통" : $("#편_세").value,
      구분: $("#편_구분").value, 핵심, 조건: $("#편_조건")?.value || "", 기준: $("#편_기준").value.trim(), 출처,
      문구: 문.map((_, i) => ({문제: $(`[data-문제="${i}"]`).value.trim(), 대책: $(`[data-대책="${i}"]`).value.trim()})).filter(m => m.문제)});
    if (!새로 && (x.변경 === "유지" || !x.변경)) { x.변경 = "수정"; x.변경이유 = "관리자 화면에서 고침"; }
    if (새로) d.항목.push(x);
    올리기끝(`항목 ${x.번호} ${새로 ? "더함" : "고침"}`, 관리목록);
  };
}

async function 점검표올리기(말) {
  const t = JSON.stringify(관리.d, null, 2);
  let r;
  try {
    r = await 연동.부르기("PUT", "체크리스트/" + 관리.이름 + ".json", {message: `점검표 ${관리.이름} — ${말}`, content: await b64(new Blob([t])), sha: 관리.sha});
  } catch (e) {
    if (e.코드 === 409) throw new Error("다른 곳에서 먼저 고쳤어요 — 목록으로 갔다가 공종을 다시 골라 주세요");
    throw e;
  }
  관리.sha = r.content.sha;
  await 저장소.사진쓰기("체크리스트/" + 관리.이름 + ".json", t);
  const 받은 = 읽어("점검표sha", {}); 받은[관리.이름 + ".json"] = 관리.sha; localStorage.setItem("점검표sha", JSON.stringify(받은));
  점검표바꿔쓰기(관리.이름, 관리.d);
}

const b64 = blob => new Promise((ok, no) => { const f = new FileReader(); f.onload = () => ok(f.result.split(",")[1]); f.onerror = () => no(f.error); f.readAsDataURL(blob); });
const 풀기64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

function 조사내용(점) {
  return {...점, 공종: 체크리스트[점.공종파일].공종, 대상명: 대상명[점.공종파일] || "", 지적: 지적목록(점), 만든때: new Date().toISOString()};
}

async function 올리기(점) {
  const 시작 = new Date().toISOString(), 올린 = [...(점.올린사진 || [])];
  for (const 이름 of [...Object.values(점.결과).flatMap(r => r.사진 || []), ...점.이전지적.flatMap(j => j.사진 || [])]) {
    if (올린.includes(이름)) continue;
    const blob = await 저장소.사진읽기(점.id + "/" + 이름);
    if (!blob) continue;
    await 연동.쓰기(`조사/${점.id}/사진/${이름}`, await b64(blob), "사진 " + 이름);
    올린.push(이름);
  }
  const 글자 = new Blob([JSON.stringify(조사내용(점), null, 1)], {type: "application/json"});
  await 연동.쓰기(`조사/${점.id}/조사.json`, await b64(글자), `조사 ${점.공사명} ${점.차수}차`, true);
  const 새 = await 저장소.읽기(점.id) || 점;        // 올리는 동안 고친 것은 지키고 기록만 더한다
  Object.assign(새, {올린때: 시작, 올린사진: 올린});
  await 저장소.쓰기(새);
  if (지금?.id === 점.id) Object.assign(지금, {올린때: 시작, 올린사진: 올린});
}

let 연동시계;
async function 연동하기() {
  clearTimeout(연동시계);
  if (연동.중) return;
  if (!연동.열쇠()) { 연동.상태 = "꺼짐 — 이 앱에 열쇠가 없어요 (눌러서 넣기)"; return 연동글(); }
  if (!navigator.onLine) { 연동.상태 = "인터넷 없음 — 연결되면 PC로 보내요"; return 연동글(); }
  연동.중 = true;
  try {
    let n = 0;
    const 받을 = await 연동.준비목록();          // 보낼 게 없어도 실제로 닿는지 확인
    for (const p of await 저장소.목록()) if (!p.올린때 || p.올린때 < (p.고친때 || "")) { await 올리기(p); n++; }
    const 새자료 = await PC자료받기(받을), 새표 = await 점검표받기();
    if ((새자료 || 새표) && !지금 && $("#연동띠")) 목록화면();
    const t = new Date();
    연동.상태 = `✓ 연결됨 · PC와 맞춤 ${String(t.getHours()).padStart(2, "0")}:${String(t.getMinutes()).padStart(2, "0")}${n ? ` · 점검 ${n}개 보냄` : ""} · 불러온 현장 ${불러온현장().length}곳`;
  } catch (e) { 연동.상태 = "보내지 못함 — " + e.message + " (잠시 뒤 다시 해요)"; }
  연동.중 = false;
  연동글();
}
function 연동글() {
  document.querySelectorAll("[data-연동글]").forEach(el => el.textContent = 연동.상태);
  const 띠 = $("#연동띠"); if (띠) 띠.dataset.상태 = 연동.상태.startsWith("✓") ? "좋음" : 연동.상태.startsWith("꺼짐") || 연동.상태.startsWith("보내지") ? "나쁨" : "";
}
function 연동예약(초 = 15) { clearTimeout(연동시계); 연동시계 = setTimeout(연동하기, 초 * 1000); }
addEventListener("online", () => 연동하기());
setInterval(연동하기, 120000);

$("#처음으로").onclick = async () => { if (지금) await 저장(true); 지금 = null; if (새판) location.reload(); else 목록화면(); };
if (navigator.storage?.persist) navigator.storage.persist();
// 웹(https)에 올린 판: 화면을 기기에 저장해 두고 인터넷 없이도 연다 (sw.js)
let 새판 = false;
if ((location.protocol === "https:" || location.hostname === "localhost") && "serviceWorker" in navigator) {
  const 있던 = !!navigator.serviceWorker.controller;      // 처음 설치 때는 다시 열 필요 없음
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!있던) return;
    if (지금) { 새판 = true; 알림("새 판을 받았어요 — 첫 화면으로 가면 바뀌어요"); } else location.reload();
  });
  navigator.serviceWorker.register("sw.js").then(r => r.update()).catch(() => {});
}
점검표불러오기().finally(() => { 목록화면(); 연동하기(); });
</script>
